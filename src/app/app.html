@if (actualizacion.hayVersionNueva()) {
  <div class="aviso aviso-actualizacion" role="status">
    <span>Hay una versión nueva de Mi Bolsillo.</span>
    <button type="button" (click)="actualizacion.actualizar()">Actualizar</button>
  </div>
}
@if (persistencia.mostrarAviso()) {
  <div class="aviso aviso-persistencia" role="status">
    <span>
      Este navegador podría borrar tus gastos si no usas la app por un tiempo.
      Instálala en la pantalla de inicio para protegerlos.
    </span>
    <button type="button" (click)="persistencia.cerrarAviso()">Entendido</button>
  </div>
}

<main class="contenido">
  <router-outlet />
</main>

<nav class="navegacion" aria-label="Secciones">
  <a class="pestana" routerLink="/inicio" routerLinkActive="activa" ariaCurrentWhenActive="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
    </svg>
    <span>Inicio</span>
  </a>
  <a class="pestana" routerLink="/registro" routerLinkActive="activa" ariaCurrentWhenActive="page">
    <span class="icono-principal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14" />
      </svg>
    </span>
    <span>Registrar</span>
  </a>
  <a class="pestana" routerLink="/historial" routerLinkActive="activa" ariaCurrentWhenActive="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01" />
    </svg>
    <span>Historial</span>
  </a>
  <a class="pestana" routerLink="/estadisticas" routerLinkActive="activa" ariaCurrentWhenActive="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M5 20V11M12 20V5M19 20v-6" />
    </svg>
    <span>Estadísticas</span>
  </a>
</nav>
