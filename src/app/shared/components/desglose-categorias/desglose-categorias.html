<div class="reparto" aria-hidden="true">
    @for (item of items(); track item.categoria) {
    <span [style.width.%]="item.porcentaje" [style.background]="color(item.categoria)"></span>
    }
</div>

<ul class="categorias">
    @for (item of items(); track item.categoria) {
    <li>
        <div class="fila">
            <span class="nombre">
                <span class="punto" [style.background]="color(item.categoria)" aria-hidden="true"></span>
                {{ nombres[item.categoria] }}
            </span>
            <span class="valor">{{ item.total | pesos }} · {{ formatearPorcentaje(item.porcentaje) }}</span>
        </div>
        <div class="barra" aria-hidden="true">
            <div class="relleno" [style.width.%]="item.porcentaje" [style.background]="color(item.categoria)"></div>
        </div>
    </li>
    }
</ul>
