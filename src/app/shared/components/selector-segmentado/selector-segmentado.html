<div class="selector" role="group" [attr.aria-label]="etiqueta()"
    [style.grid-template-columns]="'repeat(' + opciones().length + ', 1fr)'">
    @for (opcion of opciones(); track opcion.valor) {
    <button type="button" [attr.aria-pressed]="valor() === opcion.valor" (click)="valor.set(opcion.valor)">
        {{ opcion.texto }}
    </button>
    }
</div>
